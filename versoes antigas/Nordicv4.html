<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nordic — Beta</title>
<style>
:root{--bg:#101d26;--panel:#20313a;--panel2:#2c414a;--gold:#e4bb74;--text:#ebeee8;--good:#82c3a1;--bad:#c76565;--accent:#688b91;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;font-size:14px}
header{background:var(--panel2);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--accent)}
header h1{font-size:16px;margin:0;color:var(--gold);flex:1 1 100%}
.settings-gear{flex:0 0 auto;background:var(--panel);color:var(--gold);border:1px solid var(--accent);padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;margin-right:auto}
.settings-gear:hover{background:var(--accent);color:#10212b}
.res{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;flex:1 1 100%}
.res span b{color:var(--gold)}
nav{display:flex;gap:6px;padding:8px;background:var(--panel);flex-wrap:wrap;overflow-x:auto}
nav button{background:var(--panel2);color:var(--text);border:1px solid var(--accent);padding:6px 12px;border-radius:4px;cursor:pointer;font-family:inherit}
nav button.active{background:var(--gold);color:#10212b;font-weight:bold}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #4a3c2440}
.row:last-child{border-bottom:none}
button.act{background:var(--accent);color:var(--text);border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
button.act:disabled{opacity:.4;cursor:not-allowed}
button.act.lang-active{background:var(--gold);color:#10212b;font-weight:bold}
button.skip{background:#5a4a2a;font-size:11px;padding:4px 8px}
.bar{width:100%;background:#10212b;border-radius:4px;height:8px;overflow:hidden;margin-top:4px}
.bar>div{background:var(--good);height:100%}
small{color:#c9b98a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
h2{color:var(--gold);font-size:15px;margin:4px 0 10px}
.report{border-left:4px solid var(--good);padding:6px 10px;margin-bottom:8px;background:var(--panel2);border-radius:4px}
.report.lost{border-left-color:var(--bad)}
input[type=number]{width:70px;background:#10212b;color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:4px}
.tag{font-size:11px;color:#c9b98a}
.login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(165deg,#172e39aa,#09151bdd),radial-gradient(ellipse at 30% 20%,#597683 0%,#192d36 55%,#0b161f 100%);z-index:20;padding:20px;overflow-y:auto;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.login-card{background:#1c303aeF;border:1px solid var(--accent);border-radius:14px;padding:24px;max-width:540px;width:100%;text-align:center;box-shadow:0 18px 70px #061017aa;margin:auto}
.login-card h1{color:var(--gold);margin:0 0 6px;font-size:20px}
.login-card p{color:#c9b98a;font-size:13px;margin:0 0 14px}
.login-card input[type=text]{width:100%;background:#10212b;color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:8px;font-family:inherit;font-size:14px;margin-bottom:10px}
.login-card button.act{width:100%;padding:9px;font-size:13px}
.login-card .logo{font-size:42px;letter-spacing:.17em;text-shadow:0 3px 18px #d8bd7555}
.menu-choice{width:100%;display:block;background:#29424c;color:var(--text);border:1px solid #6e9395;border-radius:9px;padding:13px;margin:10px 0;cursor:pointer;text-align:left;font:inherit}
.menu-choice strong{font-size:17px;color:var(--gold)}.menu-choice small{display:block;margin-top:4px}
.menu-fields{display:grid;gap:8px;text-align:left}.menu-fields label{font-size:12px;color:var(--gold)}
.menu-note{font-size:12px;color:#d5cba9;line-height:1.5;margin:10px 0}
.map-label{font-size:11px;background:#142932d9;color:#f3e9d5;border:1px solid #ae9974;border-radius:5px;padding:2px 5px;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.village-art{width:100%;max-width:900px;display:block;margin:0 auto;border-radius:8px;border:1px solid #769195}
.profile-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.profile-list button{background:var(--panel2);color:var(--text);border:1px solid var(--accent);padding:5px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
.exit-btn{background:#5a2020;color:var(--text);border:1px solid #8a3030;padding:6px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;white-space:nowrap}
.profile-tag{font-size:12px;color:var(--gold);white-space:nowrap}
.attack-banner{background:var(--bad);color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.4);padding-top:calc(8px + env(safe-area-inset-top,0px))}
.attack-banner.imminent{background:#7a1010;animation:pulseBanner 1s infinite}
@keyframes pulseBanner{0%,100%{opacity:1}50%{opacity:.6}}

/* ---- Configurações (settings modal) ---- */
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(10,8,4,.72);z-index:50;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.settings-panel{background:var(--panel);border:2px solid var(--accent);border-radius:10px;width:min(760px,100%);height:min(600px,90vh);display:flex;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.settings-sidebar{width:190px;flex:0 0 190px;background:var(--panel2);border-right:1px solid var(--accent);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.settings-profile{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid #8a6d2f60;text-align:center}
.settings-profile .avatar{width:52px;height:52px;border-radius:50%;background:#10212b;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px}
.settings-username{color:var(--gold);font-weight:bold;font-size:13px;word-break:break-word}
.settings-nav{display:flex;flex-direction:column;gap:6px}
.settings-nav button{background:transparent;color:var(--text);border:1px solid var(--accent);padding:8px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;text-align:left}
.settings-nav button.active{background:var(--gold);color:#10212b;font-weight:bold;border-color:var(--gold)}
.settings-content{flex:1 1 auto;padding:16px;overflow-y:auto;position:relative}
.settings-close{position:absolute;top:8px;right:10px;background:transparent;border:none;color:var(--text);font-size:18px;cursor:pointer;line-height:1}
.settings-close:hover{color:var(--bad)}
.switch{position:relative;display:inline-block;width:42px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#5a4a2a;border-radius:22px;transition:.2s}
.switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#eee0c0;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--good)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.toast-region{position:fixed;right:20px;bottom:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;width:min(390px,calc(100vw - 32px));pointer-events:none}
.toast{position:relative;padding:17px 42px 17px 18px;background:#172d30;color:#f3e6cc;border:1px solid #b39561;border-left:4px solid #cf9255;border-radius:9px;box-shadow:0 8px 28px #0008;font-size:14px;line-height:1.5;pointer-events:auto;opacity:1;transform:translateY(0);transition:opacity .45s ease,transform .45s ease}
.toast.is-closing{opacity:0;transform:translateY(10px);pointer-events:none}.toast-close{position:absolute;right:7px;top:6px;background:transparent;border:0;color:#e7d4ae;font-size:22px;cursor:pointer;padding:2px 7px}.toast-close:focus-visible{outline:2px solid #e7d4ae}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
select{background:#10212b;color:#ebeee8;border:1px solid #688b91;border-radius:5px;padding:7px;max-width:100%}
.map-toolbar{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}.map-toolbar h2{margin:0}
#world-viewport{height:500px;max-height:65vh;min-height:320px;position:relative;overflow:hidden;background:#3c6470;border:1px solid #91aaa0;border-radius:10px;touch-action:none;cursor:grab;user-select:none;isolation:isolate}#world-viewport.dragging{cursor:grabbing}#world-viewport:focus-visible{outline:2px solid var(--gold)}
#world-terrain{position:absolute;left:0;top:0;width:2600px;height:1800px;transform-origin:0 0;pointer-events:none}#world-markers{position:absolute;inset:0;pointer-events:none}
.world-marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:112px;padding:0;border:0;background:transparent;color:#f4e9d1;font-family:inherit;pointer-events:auto;cursor:pointer;line-height:1.15}.world-marker svg{filter:drop-shadow(0 2px 2px #193932);pointer-events:none}.marker-name{font-size:11px;background:#192d33eb;border:1px solid #b8a279;padding:3px 5px;border-radius:4px;max-width:112px;white-space:normal}.marker-level{font-size:10px;background:#49342dea;padding:2px 5px;border-radius:0 0 4px 4px}.owned .marker-level{background:#254e3c}.owned .marker-name{border-color:#86c7a2}.world-marker:hover,.world-marker:focus-visible{z-index:3;filter:brightness(1.2);outline:none}.world-marker:focus-visible .marker-name{outline:2px solid var(--gold)}
.world-marker[data-key="home"] .marker-name{position:absolute;bottom:100%;margin-bottom:14px}.world-marker[data-key="home"] .marker-level{position:absolute;bottom:100%;margin-bottom:0}
.map-compass,.map-scale{position:absolute;pointer-events:none;background:#142932dd;border-radius:5px;padding:6px 9px;color:#ecddb6;right:10px}.map-compass{top:10px}.map-scale{bottom:10px}#map-detail{margin-top:12px}#map-detail details{padding:10px 0}#map-detail summary{cursor:pointer;color:var(--gold)}
</style>
</head>

 <div class="login-card" id="loginCard"></div>
</div>

<div id="attackBanner" class="attack-banner" style="display:none"></div>

</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="settingsModal" class="settings-overlay"></div>

function mergeCFG(base,override){
 let out=JSON.parse(JSON.stringify(base));
 if(!override) return out;
 if(override.resBase) Object.assign(out.resBase,override.resBase);
 ['growth','farmBase','farmGrowth','storeBase','mainSpeedPerLevel','attackSecPerDist'].forEach(k=>{ if(override[k]!==undefined && !isNaN(override[k])) out[k]=override[k]; });
 if(override.units) for(let u in override.units){ if(!out.units[u]) out.units[u]={cost:{}}; Object.assign(out.units[u],override.units[u]); if(override.units[u].cost) Object.assign(out.units[u].cost,override.units[u].cost); }
 return out;
}

function settlementKey(id){return 'v'+id;}

function activateVillageFields(id){let v=S.ownedVillages[id];if(!v)return false;for(const k of SETTLEMENT_FIELDS)S[k]=v[k];S.activeVillageId=id;return true;}
function ensureKingdom(){
 if(!S)return;
 if(!S.ownedVillages){
  const pending=new Set(S.attacks.map(a=>a.target));const old=S.villages||[];
  S.villages=createWorldVillages();
  // Preserve defending armies for attacks already underway in older saves.
  for(const v of S.villages){const prev=old.find(x=>x.id===v.id);if(prev&&pending.has(v.id)){v.troops={catapult:0,...prev.troops};v.res=prev.res;}}
  S.activeVillageId='home';S.ownedVillages={home:snapshotVillage()};S.kingdomVersion=1;
 }
 S.activeVillageId ||= 'home';
}

function createConqueredVillage(v,units,at){
 const d=defaultState();d.buildings={...v.buildings};d.res={...v.res};d.towers=[...v.towers];d.troops={spear:0,sword:0,catapult:0,...units};d.lastTick=at;
 const cap=Math.round(CFG.storeBase*Math.pow(CFG.growth,d.buildings.main+d.buildings.store-2));
 d.food=Math.max(1000,Math.min(cap*2,Object.values(units).reduce((n,q)=>n+q,0)*CFG.foodPerTroop*8));

}
function load(name){
 let s=localStorage.getItem(profileKey(name));
 if(s){try{
  let parsed=JSON.parse(s);
  parsed.buildings.meat ??= 1; parsed.buildings.tavern ??= 0;parsed.buildings.wall ??= 0;
  parsed.buildings.wood ??= 1;parsed.buildings.clay ??= 1;parsed.buildings.iron ??= 1;parsed.buildings.store ??= 1;parsed.buildings.farm ??= 1;
  parsed.towers=Array.isArray(parsed.towers)?Array.from({length:4},(_,i)=>Math.min(5,Math.max(0,Number(parsed.towers[i])||0))):[0,0,0,0];
  parsed.food ??= 1000;parsed.troops.catapult ??= 0;
  parsed.stats=Object.assign(defaultStats(),parsed.stats||{});
  for(let key of ['troopsTrained','troopsLost']) parsed.stats[key]=Object.assign({spear:0,sword:0,catapult:0},parsed.stats[key]||{});
  // Older saves used one entry for an entire group. Expand it into serial units.
  let cursor=0,queue=[];
  for(let q of parsed.trainQueue||[]){if(q.qty===undefined){queue.push(q);cursor=q.end;continue;}let qty=Math.max(1,Math.min(100000,Number(q.qty)||1));let ms=(CFG.units[q.unit]?.time||20)*1000;
   let first=(Number(q.end)||now())-(qty-1)*ms;
   for(let i=0;i<qty;i++){let end=Math.max(first+i*ms,cursor+ms*(cursor>0?1:0));queue.push({unit:q.unit,end});cursor=end;}
  }
  parsed.trainQueue=queue;
  if(parsed.villages)parsed.villages.forEach(v=>{v.name=({1:'Vila do Norte',2:'Vila do Leste',3:'Vila do Sul'})[v.id]||v.name;});
  return parsed;
 }catch(e){}}
 return defaultState();
}
function save(){ if(!ACTIVE_PROFILE||!S) return;ensureKingdom();storeActiveVillage();localStorage.setItem(profileKey(ACTIVE_PROFILE),JSON.stringify(S)); }

function storeCap(){return Math.round(CFG.storeBase*Math.pow(CFG.growth,(S.buildings.main-1)+(S.buildings.store-1)));}
function farmCap(){return Math.round(CFG.farmBase*Math.pow(CFG.farmGrowth,S.buildings.farm) + 45*(S.buildings.main-1));}
function foodCap(){return storeCap()*2;}
function foodSupport(){return Math.floor(S.food/CFG.foodPerTroop);}
function winRate(){let n=S.stats.attacksSentWon+S.stats.attacksSentLost;return n?S.stats.attacksSentWon/n:0;}
function happiness(){let housing=Math.min(1,farmCap()/Math.max(1,popUsed()));let food=Math.min(1,foodSupport()/Math.max(1,popUsed()));let history=winRate()>=.75?25:Math.round(winRate()*20);return Math.min(100,Math.round(food*40+housing*35+history+Math.min(5,S.buildings.tavern)*10));}
function combatBonus(h=happiness()){return h>=60? +(h/100*.5).toFixed(3):0;}
function combatPower(units,stat,bonus){return Object.entries(units).reduce((sum,[u,n])=>sum+(CFG.units[u]?.[stat]||0)*n,0)*(1+bonus)*(stat==='atk'?1+bonus:1);}

function popUsed(){return Object.entries(S.troops).reduce((n,[u,q])=>n+q*(CFG.units[u]?.pop||1),0)+S.trainQueue.reduce((n,q)=>n+(CFG.units[q.unit]?.pop||1),0)+(S.attacks||[]).reduce((sum,a)=>sum+Object.entries(a.units).reduce((n,[u,q])=>n+q*(CFG.units[u]?.pop||1),0),0);}
function defenseMultiplier(buildings=S.buildings,towers=S.towers){return 1+(buildings.wall||0)*0.10+(Array.isArray(towers)?towers.reduce((a,n)=>a+n,0):0)*0.05;}
function unitTrainSeconds(u){return Math.max(1,Math.round(CFG.units[u].time/(1+(S.buildings.main-1)*CFG.mainSpeedPerLevel)));}
function towerCost(i,lvl){let factor=Math.pow(1.3,i)*Math.pow(1.4,lvl);return {wood:Math.round(500*factor),clay:Math.round(620*factor),iron:Math.round(430*factor)};}

function prodPerSec(type){let lvl=S.buildings[type];if(!lvl)return type==='wood'?CFG.resBase.wood*.12:type==='clay'?CFG.resBase.clay*.15:0;return CFG.resBase[type]*Math.pow(CFG.growth,lvl-1);}
function prodPerHour(type){return prodPerSec(type)*3600;}

function accrueVillage(to){
 let dt=Math.max(0,(to-S.lastTick)/3600000);if(!dt)return;
 RES_KEYS.forEach(r=>{let gain=Math.max(0,Math.min(storeCap()-S.res[r],prodPerHour(r)*dt));S.res[r]+=gain;S.stats.resGained[r]+=gain;});
 let foodGain=(S.buildings.meat?CFG.foodBase*Math.pow(CFG.growth,S.buildings.meat-1):0)*dt*3600;
 S.food=Math.max(0,Math.min(foodCap(),S.food+foodGain-popUsed()*.5*dt));S.lastTick=to;
}
function tickVillage(t){
 S.lastTick=Math.max(S.lastTick,t-24*3600000);
 const events=[...S.buildQueue.map(q=>({q,kind:'build'})),...S.trainQueue.map(q=>({q,kind:'train'}))].filter(e=>e.q.end<=t).sort((a,b)=>a.q.end-b.q.end);
 for(const e of events){
  accrueVillage(Math.max(S.lastTick,e.q.end));const q=e.q;
  if(e.kind==='build'){if(q.b==='tower')S.towers[q.tower]=q.level;else S.buildings[q.b]=q.level;S.buildQueue=S.buildQueue.filter(x=>x!==q);}
  else{S.troops[q.unit]=(S.troops[q.unit]||0)+1;S.stats.troopsTrained[q.unit]=(S.stats.troopsTrained[q.unit]||0)+1;S.trainQueue=S.trainQueue.filter(x=>x!==q);}
 }
 accrueVillage(t);S.lastTick=t;
}
function tick(){
 if(!S)return;ensureKingdom();storeActiveVillage();const selected=S.activeVillageId,t=now();
 try{
  for(const id of Object.keys(S.ownedVillages)){activateVillageFields(id);tickVillage(t);storeActiveVillage();}
  const arrivals=Object.entries(S.ownedVillages).flatMap(([id,v])=>v.attacks.filter(a=>a.arriveEnd<=t).map(a=>({id,a}))).sort((a,b)=>a.a.arriveEnd-b.a.arriveEnd);
  for(const {id,a} of arrivals){activateVillageFields(id);S.attacks=S.attacks.filter(x=>x!==a);resolveAttack(a);storeActiveVillage();}
  for(const [id,v] of Object.entries(S.ownedVillages)){if(v.lastTick<t){activateVillageFields(id);tickVillage(t);storeActiveVillage();}}
 }finally{activateVillageFields(selected);}
 save();
}

function resolveAttack(a){
 const v=S.villages.find(x=>x.id===a.target);
 if(!v||S.ownedVillages[settlementKey(a.target)]){
  for(const [u,n] of Object.entries(a.units))S.troops[u]=(S.troops[u]||0)+n;

 }

}

function safeRender(){

 renderHeader();
 let main=document.getElementById('main');
 let active=document.activeElement;
 if(active&&main.contains(active)&&(active.matches('input,textarea,select')||active.isContentEditable))return;
 // Keep edits after focus moves, including the gap between mousedown and click.
 let inputs=Array.from(main.querySelectorAll('input[id]')).map(el=>[el.id,el.value]);
 let scroll=window.scrollY;
 if(tab==='map'){updateMapLive();return;}
 renderMain();
 for(let [id,value] of inputs){let el=document.getElementById(id);if(el)el.value=value;}
 if(Math.abs(window.scrollY-scroll)>3)window.scrollTo(0,scroll);
 // Settings are redrawn only on an explicit action, so typing and scrolling stay stable.
}

function showToast(message){
 const region=document.getElementById('toast-region');if(!region)return;
 while(region.children.length>=3)region.firstElementChild.remove();
 const box=document.createElement('div');box.className='toast';
 const text=document.createElement('span');text.textContent=message;
 const close=document.createElement('button');close.type='button';close.className='toast-close';close.textContent='×';close.setAttribute('aria-label',feedback('close'));
 let timer,closing=false;const dismiss=()=>{if(closing)return;closing=true;clearTimeout(timer);box.classList.add('is-closing');setTimeout(()=>box.remove(),450);};
 close.addEventListener('click',dismiss);box.append(text,close);region.append(box);timer=setTimeout(dismiss,5000);
}

function train(u){

 if(!input||!info||S.buildings.barracks<1||(u==='catapult'&&S.buildings.barracks<10))return;
 let qty=Number(input.value);
 if(!Number.isSafeInteger(qty)||qty<1||qty>1000){showToast(feedback('quantity'));return;}
 let totalCost={wood:info.cost.wood*qty,clay:info.cost.clay*qty,iron:info.cost.iron*qty};
 if(S.res.wood<totalCost.wood||S.res.clay<totalCost.clay||S.res.iron<totalCost.iron){showToast(feedback('resources'));return;}
 if(popUsed()+qty*info.pop>farmCap()){showToast(t('housing_shortage'));return;}
 if(popUsed()+qty*info.pop>foodSupport()){showToast(t('food_shortage'));return;}
 for(let r of RES_KEYS){S.res[r]-=totalCost[r];S.stats.resSpent[r]+=totalCost[r];}
 let end=Math.max(now(),S.trainQueue.at(-1)?.end||0),duration=unitTrainSeconds(u)*1000;
 for(let i=0;i<qty;i++){end+=duration;S.trainQueue.push({unit:u,end});}
 save();render();
}
function skipTrain(i){

 tick();render();
}

function mapMetrics(){let el=document.getElementById('world-viewport');return el?{el,w:el.clientWidth,h:el.clientHeight}:null;}
function paintWorldMap(){
 let m=mapMetrics();if(!m)return;const {w,h}=m,z=mapCamera.zoom;
 mapCamera.x=Math.max(Math.min(1300,w/(2*z)),Math.min(Math.max(1300,2600-w/(2*z)),mapCamera.x));
 mapCamera.y=Math.max(Math.min(900,h/(2*z)),Math.min(Math.max(900,1800-h/(2*z)),mapCamera.y));
 let tx=w/2-mapCamera.x*z,ty=h/2-mapCamera.y*z;
 document.getElementById('world-terrain').style.transform=`translate(${tx}px,${ty}px) scale(${z})`;
 m.el.querySelectorAll('.world-marker').forEach(el=>{el.style.left=(Number(el.dataset.x)*z+tx)+'px';el.style.top=(Number(el.dataset.y)*z+ty)+'px';});
 document.getElementById('map-scale').textContent=Math.round(z*100)+'%';
}
function zoomWorldMap(factor,px,py){let m=mapMetrics();if(!m)return;px??=m.w/2;py??=m.h/2;let old=mapCamera.zoom,min=Math.min(m.w/2600,m.h/1800)*.95,z=Math.max(min,Math.min(2.4,old*factor));mapCamera.x+=(px-m.w/2)*(1/old-1/z);mapCamera.y+=(py-m.h/2)*(1/old-1/z);mapCamera.zoom=z;paintWorldMap();}
function centerWorldMap(){let p=activeVillagePosition();mapCamera.x=p.x;mapCamera.y=p.y;mapCamera.zoom=1;paintWorldMap();}
function fitWorldMap(){let m=mapMetrics();if(!m)return;mapCamera={x:1300,y:900,zoom:Math.min(m.w/2600,m.h/1800)*.98};paintWorldMap();}
function bindWorldMap(){
 const m=mapMetrics();if(!m)return;const el=m.el;mapDrag=null;mapDetailSignature=detailSignature();
 el.addEventListener('wheel',e=>{e.preventDefault();const r=el.getBoundingClientRect();zoomWorldMap(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
 el.addEventListener('pointerdown',e=>{if(e.button!==0)return;mapDrag={id:e.pointerId,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,moved:false};});
 el.addEventListener('pointermove',e=>{if(!mapDrag||e.pointerId!==mapDrag.id)return;let d=mapDrag;if(Math.hypot(e.clientX-d.startX,e.clientY-d.startY)>5){d.moved=true;el.setPointerCapture(e.pointerId);el.classList.add('dragging');}if(d.moved){mapCamera.x-=(e.clientX-d.x)/mapCamera.zoom;mapCamera.y-=(e.clientY-d.y)/mapCamera.zoom;paintWorldMap();}d.x=e.clientX;d.y=e.clientY;});
 const finish=e=>{if(!mapDrag||e.pointerId!==mapDrag.id)return;if(el.hasPointerCapture(e.pointerId))el.releasePointerCapture(e.pointerId);el.classList.remove('dragging');setTimeout(()=>{mapDrag=null;},0);};
 el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);el.addEventListener('pointerleave',e=>{if(mapDrag&&!mapDrag.moved)mapDrag=null;});
 el.addEventListener('keydown',e=>{if(e.target!==el)return;let dirs={ArrowLeft:[-80,0],ArrowRight:[80,0],ArrowUp:[0,-80],ArrowDown:[0,80]};if(dirs[e.key]){e.preventDefault();mapCamera.x+=dirs[e.key][0]/mapCamera.zoom;mapCamera.y+=dirs[e.key][1]/mapCamera.zoom;paintWorldMap();}if(e.key==='+'||e.key==='='){e.preventDefault();zoomWorldMap(1.25);}if(e.key==='-'){e.preventDefault();zoomWorldMap(.8);}});
 if(mapResizeObserver)mapResizeObserver.disconnect();if(typeof ResizeObserver!=='undefined'){mapResizeObserver=new ResizeObserver(paintWorldMap);mapResizeObserver.observe(el);}paintWorldMap();
}

function worldStorageKey(key){return WORLD?.legacy?key:`nordic_${WORLD.code}_${key}`;}
async function rawSharedGet(key){if(!mpReady)return null;try{let item=await window.storage.get(key,true);return item?JSON.parse(item.value):null;}catch(e){return null;}}

async function mpEnsureJoined(){

 let players=(await wsGet('world_players'))||{};
 if(players[myId]!==undefined){
  mySlot=players[myId].slot;
 } else {

function pruneAttacks(attacks){
 let out={};
 for(let id in attacks){
  let a=attacks[id];
  if(!a.resolved || (now()-a.arriveEnd)<15*60*1000) out[id]=a;
 }
 return out;
}
function pruneReports(reports){
 let vals=Object.entries(reports).sort((a,b)=>b[1].time-a[1].time).slice(0,80);
 let out={}; vals.forEach(([id,r])=>out[id]=r); return out;
}

 let sw=Number(document.getElementById('mpsend_sword_'+targetId).value),cat=Number(document.getElementById('mpsend_catapult_'+targetId)?.value||0);
 if(!validAttackUnits(sp,sw,cat))return;
 const origin=S.activeVillageId,bonus=combatBonus();S.troops.spear-=sp;S.troops.sword-=sw;S.troops.catapult-=cat; S.stats.attacksSent++; save();
 await mpSync();

 let id='a'+now()+'_'+Math.random().toString(36).slice(2,7);
 attacks[id]={id,origin,from:myId,to:targetId,units:{spear:sp,sword:sw,catapult:cat},bonus,sentAt:now(),arriveEnd:now()+45000,resolved:false};

 if(!ok){showToast(feedback('failed'));inVillage(origin,()=>{S.troops.spear+=sp;S.troops.sword+=sw;S.troops.catapult+=cat;S.stats.attacksSent--;});save();return;}

async function mpResolveAttack(a){
 let players=(await wsGet('world_players'))||{};
 let def=players[a.to]||{troops:{spear:0,sword:0},res:{wood:0,clay:0,iron:0}};
 let atk=combatPower(a.units,'atk',a.bonus||0);
 let defp=combatPower(def.troops||{},'def',combatBonus(def.happiness||0))*defenseMultiplier(def.buildings||{},def.towers||[]);
 let win=atk>defp;
 let lossRatio=win?Math.min(0.3,defp/(atk+1)):1;
 let lost={}; for(let u in a.units) lost[u]=Math.round(a.units[u]*lossRatio);
 let loot={wood:0,clay:0,iron:0};
 if(win){
  let survivors=0; for(let u in a.units) survivors+=(a.units[u]-lost[u]);
  let cap=survivors*25;
  ['wood','clay','iron'].forEach(r=>{let av=(def.res&&def.res[r])||0;let take=Math.min(av,cap/3);loot[r]=Math.round(take);});
 }
 if(a.to===myId && S){
  inVillage('home',()=>{
  if(win) ['wood','clay','iron'].forEach(r=>{S.res[r]=Math.max(0,S.res[r]-loot[r]);});
  if(win) for(let u in S.troops){S.stats.troopsLost[u]=(S.stats.troopsLost[u]||0)+(S.troops[u]||0);S.troops[u]=0;}
  S.stats.attacksReceived++; S.stats.attacksReceivedWon += win?0:1; S.stats.attacksReceivedLost += win?1:0;
  });save(); await mpSync();
 }
 if(a.from===myId && S){
  inVillage(a.origin||'home',()=>{
  for(let u in a.units){ S.troops[u]=(S.troops[u]||0)+(a.units[u]-lost[u]); S.stats.troopsLost[u]=(S.stats.troopsLost[u]||0)+lost[u]; }
  if(win) ['wood','clay','iron'].forEach(r=>{S.res[r]=Math.min(storeCap(),S.res[r]+loot[r]);});
  S.stats.attacksSentWon += win?1:0; S.stats.attacksSentLost += win?0:1;
  });save(); await mpSync();
 }
 let attacks=(await wsGet('world_attacks'))||{};
 if(attacks[a.id]){ attacks[a.id].resolved=true; attacks=pruneAttacks(attacks); await wsSet('world_attacks',attacks); }
 let reports=(await wsGet('world_reports'))||{};
 reports[a.id]={from:a.from,to:a.to,win,sent:a.units,lost,loot,time:now()};
 reports=pruneReports(reports);
 await wsSet('world_reports',reports);
}
async function mpPoll(){
 if(!mpReady||!myId) return;
 let players=(await wsGet('world_players'))||{};
 mpPlayers=players;
 let attacks=(await wsGet('world_attacks'))||{};
 mpAttacksCache=attacks;
 for(let id in attacks){
  let a=attacks[id];
  if(!a.resolved && now()>=a.arriveEnd && (a.from===myId||a.to===myId)){
   await mpResolveAttack(a);
  }
 }
 mpIncoming=Object.values(mpAttacksCache).filter(a=>a.to===myId && !a.resolved);
 let reports=(await wsGet('world_reports'))||{};
 mpReports=Object.values(reports).filter(r=>r.from===myId||r.to===myId).sort((a,b)=>b.time-a.time);
 await fetchWorldSettings();
 safeRender();
}

 return `<div class="card"><small>${t('mp_playing_as')} <b>${myId}</b> (${t('mp_slot')} ${mySlot+1}) — ${ids.length}/4 ${t('mp_players_in_room')}.<br>${t('mp_go_to_map')}</small></div>
 <div class="card"><h2>${t('mp_players_title')}</h2>${list}</div>`;

// ---- Notificação de ataque (banner no topo) ----
function updateAttackBanner(){
 let el=document.getElementById('attackBanner');
 if(!el) return;
 if(!S){ el.style.display='none'; return; }
 let incoming=(mpIncoming||[]).filter(a=>!a.resolved && a.arriveEnd>now());
 if(incoming.length===0){ el.style.display='none'; return; }
 incoming.sort((a,b)=>a.arriveEnd-b.arriveEnd);
 let a=incoming[0];
 let total=Math.max(1,a.arriveEnd-a.sentAt);
 let progress=Math.min(1,Math.max(0,(now()-a.sentAt)/total));
 let imminent=progress>=0.75;
 el.style.display='block';
 el.className='attack-banner'+(imminent?' imminent':'');
 let extra=incoming.length>1? ` (+${incoming.length-1} ${t('attack_banner_other_attacks')})` : '';
 el.innerHTML=(imminent? t('attack_banner_imminent')+' ' : t('attack_banner_incoming')+' ')+
  `<b>${a.from}</b> ${t('attack_banner_arrives_in')} <b>${countdown(a.arriveEnd)}</b>${extra}`;
}

 CFG.storeBase=g('cfg_storebase'); CFG.attackSecPerDist=g('cfg_atkspeed');
 for(let u in CFG.units){
  CFG.units[u].atk=g('cfg_'+u+'_atk'); CFG.units[u].def=g('cfg_'+u+'_def');
  CFG.units[u].cost.wood=g('cfg_'+u+'_cw'); CFG.units[u].cost.clay=g('cfg_'+u+'_cc'); CFG.units[u].cost.iron=g('cfg_'+u+'_ci');
  CFG.units[u].time=g('cfg_'+u+'_time');
 }
 await worldSet({editMode:worldEditMode,cfg:CFG});
 showToast(t('world_edit_saved_msg'));
 render();renderSettingsModal();
}
function buildingPreviewCurrent(b){

 if(b==='main'){ let sp=Math.round((1+(lvl-1)*CFG.mainSpeedPerLevel)*100); return `<b>${sp}% · 👥${farmCap()}</b>`; }
 if(b==='farm') return `<b>${farmCap()}</b>`;
 if(b==='meat') return `<b>${(lvl?CFG.foodBase*Math.pow(CFG.growth,lvl-1):0).toFixed(2)} ${t('food_label')}/s</b>`;

function renderWorldAggregate(){
 if(S){ensureKingdom();storeActiveVillage();}let all=mpReady?Object.values(mpPlayers):(S?Object.values(S.ownedVillages):[]);

 all.forEach(p=>{
  if(p.res) ['wood','clay','iron'].forEach(r=>total.res[r]+=p.res[r]||0);
  let s=p.stats||{};
  if(s.troopsTrained) ['spear','sword','catapult'].forEach(u=>total.troopsTrained[u]+=s.troopsTrained[u]||0);
  if(s.troopsLost) ['spear','sword','catapult'].forEach(u=>total.troopsLost[u]+=s.troopsLost[u]||0);
  total.attacksSent += s.attacksSent||0;
  total.attacksReceived += s.attacksReceived||0;
 });
 return `<div class="row"><small>${t('mp_players_in_room')}</small><b>${total.players}/4</b></div>
 <div class="row"><small>🪵🧱⛏️ ${t('world_stats_res_gained')}</small><b>🪵${fmt(total.res.wood)} 🧱${fmt(total.res.clay)} ⛏️${fmt(total.res.iron)}</b></div>
 <div class="row"><small>${t('world_stats_troops_trained')}</small><b>${unitName('spear')} ${total.troopsTrained.spear} · ${unitName('sword')} ${total.troopsTrained.sword} · ${unitName('catapult')} ${total.troopsTrained.catapult}</b></div>
 <div class="row"><small>${t('world_stats_troops_lost')}</small><b>${unitName('spear')} ${total.troopsLost.spear} · ${unitName('sword')} ${total.troopsLost.sword} · ${unitName('catapult')} ${total.troopsLost.catapult}</b></div>

}

// ---- Menu de mundos e perfis (um conjunto de dados independente por mundo) ----
let menuView='home', menuMessage='';
function jsArg(value){return escapeHTML(JSON.stringify(value));}
function showMenu(view){menuView=view;menuMessage='';renderLoginScreen();}
function chooseWorld(code){let chosen=getLocalWorlds().find(w=>w.code===code);if(!chosen)return;WORLD=chosen;showMenu('profile');}
async function findWorld(code){
 let local=getLocalWorlds().find(w=>w.code===code);
 if(local)return local;
 return await rawSharedGet('nordic_meta_'+code);
}
function worldCode(){let bytes=new Uint8Array(5);if(globalThis.crypto?.getRandomValues)crypto.getRandomValues(bytes);else for(let i=0;i<5;i++)bytes[i]=Math.floor(Math.random()*256);return 'N-'+Array.from(bytes,b=>(b%36).toString(36).toUpperCase()).join('');}
async function createWorld(){
 let name=document.getElementById('worldName')?.value.trim(),player=document.getElementById('newPlayer')?.value.trim();
 if(!name||!player){menuMessage=t('menu_error');renderLoginScreen();return;}
 let code=worldCode();
 let meta={code,name:name.slice(0,32),owner:player.slice(0,20),created:now()};
 await rawSharedSet('nordic_meta_'+code,meta);
 rememberWorld(meta);WORLD=meta;
 await startGame(meta.owner);
}
async function joinWorld(){
 let code=(document.getElementById('worldCode')?.value||'').trim().toUpperCase().replace(/\s+/g,'');
 let player=(document.getElementById('joinPlayer')?.value||'').trim();
 if(!/^N-[A-Z0-9]{5}$/.test(code)||!player){menuMessage=t('menu_missing');renderLoginScreen();return;}
 let meta=await findWorld(code);
 if(!meta){menuMessage=t('menu_missing');renderLoginScreen();return;}
 rememberWorld(meta);WORLD=meta;
 await startGame(player.slice(0,20));
}
function renderLoginScreen(){
 let el=document.getElementById('loginCard');if(!el)return;
 let title=`<div style="font-size:30px">🪓 ⚔️ 🛡️ ⛵</div><h1 class="logo">NORDIC</h1><p>${t('login_desc')}</p>`;
 let back=`<button class="menu-choice" onclick="showMenu('home')">${t('menu_back')}</button>`;
 let body='';
 if(menuView==='home'){
  let worlds=getLocalWorlds();
  body=`<button class="menu-choice" onclick="showMenu('create')">🌄 <strong>${t('menu_new')}</strong><small>${t('menu_new_desc')}</small></button>
  <button class="menu-choice" onclick="showMenu('join')">⛵ <strong>${t('menu_join')}</strong><small>${t('menu_join_desc')}</small></button>
  ${worlds.length?`<h2>${t('menu_return')}</h2>${worlds.map(w=>`<button class="menu-choice" onclick="chooseWorld(${jsArg(w.code)})"><strong>🛖 ${escapeHTML(w.name)}</strong><small>${w.code}</small></button>`).join('')}`:''}`;
 } else if(menuView==='create'){
  body=`<div class="menu-fields"><label>${t('menu_world_name')}<input type="text" id="worldName" maxlength="32" placeholder="Fiorde de Midgard"></label>
  <label>${t('menu_player')}<input type="text" id="newPlayer" maxlength="20" placeholder="${t('login_placeholder')}"></label></div>
  <button class="act" onclick="createWorld()">${t('menu_create')}</button>${back}`;
 } else if(menuView==='join'){
  body=`<div class="menu-fields"><label>${t('menu_code')}<input type="text" id="worldCode" maxlength="9" placeholder="N-ABCDE" style="text-transform:uppercase"></label>
  <label>${t('menu_player')}<input type="text" id="joinPlayer" maxlength="20" placeholder="${t('login_placeholder')}"></label></div>
  <button class="act" onclick="joinWorld()">${t('menu_enter')}</button>${back}`;
 } else if(menuView==='profile'&&WORLD){
  let profiles=listProfiles();
  body=`<h2>🌄 ${escapeHTML(WORLD.name)} · ${WORLD.code}</h2><div class="menu-fields"><label>${t('menu_player')}<input type="text" id="loginName" maxlength="20" placeholder="${t('login_placeholder')}"></label></div>
  <button class="act" onclick="doLogin()">${t('menu_enter')}</button>
  ${profiles.length?`<p>${t('login_saved_profiles')}</p><div class="profile-list">${profiles.map(n=>`<button onclick="quickLogin(${jsArg(n)})">${escapeHTML(n)}</button>`).join('')}</div>`:''}${back}`;
 }
 el.innerHTML=title+body+(menuMessage?`<p role="alert" style="color:#f4b5a1">${escapeHTML(menuMessage)}</p>`:'')+`<p class="menu-note">${t('menu_local')}</p>`;
}
function doLogin(){let name=document.getElementById('loginName')?.value.trim();if(name)startGame(name);}
function quickLogin(name){startGame(name);}
async function startGame(name){
 name=(name||'').trim().slice(0,20);
 if(!name||!WORLD)return;
 ACTIVE_PROFILE=name;myId=name;setActiveProfile(name);
 S=load(name);ensureKingdom();mapCamera={x:550,y:850,zoom:1};openPlot=null;
 document.getElementById('loginScreen').style.display='none';
 document.getElementById('gameRoot').style.display='block';
 await fetchWorldSettings();
 tick();render();renderSettingsModal();
 if(mpReady){try{await mpEnsureJoined();startMpPolling();render();}catch(e){}}
}
function doLogoutSilent(){
 if(!S)return;
 save();clearActiveProfile();stopMpPolling();
 ACTIVE_PROFILE=null;S=null;myId='';mySlot=0;WORLD=null;
 mpPlayers={};mpIncoming=[];mpReports=[];mpAttacksCache={};
 CFG=defaultCFG();worldEditMode=false;menuView='home';
 document.getElementById('gameRoot').style.display='none';
 document.getElementById('loginScreen').style.display='flex';
 renderSettingsModal();updateAttackBanner();renderLoginScreen();
}
function doLogout(){if(!S)return;if(!confirm(t('account_logout_confirm')))return;doLogoutSilent();}
function initLoginScreen(){renderLoginScreen();}
initLoginScreen();
