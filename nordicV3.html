<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reinos de Aldeia - Beta</title>
<style>
:root{--bg:#2b2213;--panel:#3b2f1c;--panel2:#4a3c24;--gold:#d9b458;--text:#eee0c0;--good:#7fbf5a;--bad:#c25c5c;--accent:#8a6d2f;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,serif;font-size:14px}
header{background:var(--panel2);padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--accent)}
header h1{font-size:16px;margin:0;color:var(--gold);flex:1 1 100%}
.settings-gear{flex:0 0 auto;background:var(--panel);color:var(--gold);border:1px solid var(--accent);padding:5px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;margin-right:auto}
.settings-gear:hover{background:var(--accent);color:#2b2213}
.res{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;flex:1 1 100%}
.res span b{color:var(--gold)}
nav{display:flex;gap:6px;padding:8px;background:var(--panel);flex-wrap:wrap;overflow-x:auto}
nav button{background:var(--panel2);color:var(--text);border:1px solid var(--accent);padding:6px 12px;border-radius:4px;cursor:pointer;font-family:inherit}
nav button.active{background:var(--gold);color:#2b2213;font-weight:bold}
main{padding:12px;max-width:900px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--accent);border-radius:6px;padding:10px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid #4a3c2440}
.row:last-child{border-bottom:none}
button.act{background:var(--accent);color:var(--text);border:none;padding:6px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
button.act:disabled{opacity:.4;cursor:not-allowed}
button.act.lang-active{background:var(--gold);color:#2b2213;font-weight:bold}
button.skip{background:#5a4a2a;font-size:11px;padding:4px 8px}
.bar{width:100%;background:#1e1810;border-radius:4px;height:8px;overflow:hidden;margin-top:4px}
.bar>div{background:var(--good);height:100%}
small{color:#c9b98a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
h2{color:var(--gold);font-size:15px;margin:4px 0 10px}
.report{border-left:4px solid var(--good);padding:6px 10px;margin-bottom:8px;background:var(--panel2);border-radius:4px}
.report.lost{border-left-color:var(--bad)}
input[type=number]{width:70px;background:#1e1810;color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:4px}
.tag{font-size:11px;color:#c9b98a}
.login-wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#3b2f1c 0%,#1e1810 100%);z-index:20;padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.login-card{background:var(--panel);border:1px solid var(--accent);border-radius:8px;padding:22px;max-width:340px;width:100%;text-align:center}
.login-card h1{color:var(--gold);margin:0 0 6px;font-size:20px}
.login-card p{color:#c9b98a;font-size:13px;margin:0 0 14px}
.login-card input[type=text]{width:100%;background:#1e1810;color:var(--text);border:1px solid var(--accent);border-radius:4px;padding:8px;font-family:inherit;font-size:14px;margin-bottom:10px}
.login-card button.act{width:100%;padding:9px;font-size:13px}
.profile-list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.profile-list button{background:var(--panel2);color:var(--text);border:1px solid var(--accent);padding:5px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px}
.exit-btn{background:#5a2020;color:var(--text);border:1px solid #8a3030;padding:6px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:12px;white-space:nowrap}
.profile-tag{font-size:12px;color:var(--gold);white-space:nowrap}
.attack-banner{background:var(--bad);color:#fff;text-align:center;padding:8px 12px;font-size:13px;font-weight:bold;box-shadow:0 2px 8px rgba(0,0,0,.4);padding-top:calc(8px + env(safe-area-inset-top,0px))}
.attack-banner.imminent{background:#7a1010;animation:pulseBanner 1s infinite}
@keyframes pulseBanner{0%,100%{opacity:1}50%{opacity:.6}}

/* ---- Configurações (settings modal) ---- */
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(10,8,4,.72);z-index:50;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.settings-panel{background:var(--panel);border:2px solid var(--accent);border-radius:10px;width:min(760px,100%);height:min(600px,90vh);display:flex;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.settings-sidebar{width:190px;flex:0 0 190px;background:var(--panel2);border-right:1px solid var(--accent);display:flex;flex-direction:column;padding:14px 10px;overflow-y:auto}
.settings-profile{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:12px;margin-bottom:10px;border-bottom:1px solid #8a6d2f60;text-align:center}
.settings-profile .avatar{width:52px;height:52px;border-radius:50%;background:#1e1810;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:26px}
.settings-username{color:var(--gold);font-weight:bold;font-size:13px;word-break:break-word}
.settings-nav{display:flex;flex-direction:column;gap:6px}
.settings-nav button{background:transparent;color:var(--text);border:1px solid var(--accent);padding:8px 10px;border-radius:5px;cursor:pointer;font-family:inherit;font-size:12px;text-align:left}
.settings-nav button.active{background:var(--gold);color:#2b2213;font-weight:bold;border-color:var(--gold)}
.settings-content{flex:1 1 auto;padding:16px;overflow-y:auto;position:relative}
.settings-close{position:absolute;top:8px;right:10px;background:transparent;border:none;color:var(--text);font-size:18px;cursor:pointer;line-height:1}
.settings-close:hover{color:var(--bad)}
.switch{position:relative;display:inline-block;width:42px;height:22px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.switch .slider{position:absolute;cursor:pointer;inset:0;background:#5a4a2a;border-radius:22px;transition:.2s}
.switch .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#eee0c0;border-radius:50%;transition:.2s}
.switch input:checked+.slider{background:var(--good)}
.switch input:checked+.slider:before{transform:translateX(20px)}
</style>
</head>

<div id="loginScreen" class="login-wrap">
 <div class="login-card" id="loginCard"></div>
</div>
<div id="gameRoot" style="display:none">
<div id="attackBanner" class="attack-banner" style="display:none"></div>

<h1>🏰 Reinos de Aldeia — Beta</h1>
<button class="settings-gear" onclick="openSettings()">⚙️ <span id="gearLabel"></span></button>
<div class="res" id="resBar"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="settingsModal" class="settings-overlay"></div>

function tick(){
 if(!S) return;
 let t=now(), dt=(t-S.lastTick)/3600000;
 RES_KEYS.forEach(r=>{let cap=storeCap(); let gain=Math.min(cap-S.res[r],prodPerHour(r)*dt); if(gain>0){S.res[r]+=gain; S.stats.resGained[r]+=gain;}});
 S.lastTick=t;
 // building queue
 S.buildQueue=S.buildQueue.filter(q=>{
  if(t>=q.end){S.buildings[q.b]=q.level;addLog();return false;} return true;
 });
 // train queue
 S.trainQueue=S.trainQueue.filter(q=>{
  if(t>=q.end){S.troops[q.unit]+=q.qty; S.stats.troopsTrained[q.unit]+=q.qty; return false;} return true;
 });
 // attacks
 S.attacks=S.attacks.filter(a=>{
  if(t>=a.arriveEnd){resolveAttack(a);return false;} return true;
 });
 save();
}
function addLog(){}

function resolveAttack(a){
 let v=S.villages.find(x=>x.id===a.target);
 let atk=0; for(let u in a.units) atk+=a.units[u]*(CFG.units[u]?CFG.units[u].atk:10);
 let def=0; for(let u in v.troops) def+=v.troops[u]*(CFG.units[u]?CFG.units[u].def:8);
 let win = atk > def;
 let lossRatio = win? Math.min(0.3, def/(atk+1)) : 1;
 let lost={};
 for(let u in a.units){lost[u]=Math.round(a.units[u]*lossRatio);}
 let loot={wood:0,clay:0,iron:0};
 if(win){
  let survivors=0; for(let u in a.units) survivors+=(a.units[u]-lost[u]);
  let capacity=survivors*25;
  ['wood','clay','iron'].forEach(r=>{let take=Math.min(v.res[r],capacity/3);loot[r]=Math.round(take);v.res[r]=Math.round(v.res[r]-take);});
  v.troops={}; // barb troops wiped on loss (simplified)
  for(let u in CFG.units) v.troops[u]=0;
  S.res.wood=Math.min(storeCap(),S.res.wood+loot.wood);
  S.res.clay=Math.min(storeCap(),S.res.clay+loot.clay);
  S.res.iron=Math.min(storeCap(),S.res.iron+loot.iron);
 } else {
  for(let u in a.units) lost[u]=a.units[u];
 }
 for(let u in a.units){S.troops[u]+=(a.units[u]-lost[u]); S.stats.troopsLost[u]=(S.stats.troopsLost[u]||0)+lost[u];}
 S.stats.attacksSentWon += win?1:0; S.stats.attacksSentLost += win?0:1;
 S.reports.unshift({time:now(),target:v.name,win,sent:a.units,lost,loot,enemyDef:def,atk});
}

function upgrade(b){

async function wsGet(key){

}

}

async function mpEnsureJoined(){
 if(!mpReady||!myId) return;
 let players=(await wsGet('world_players'))||{};
 if(players[myId]!==undefined){
  mySlot=players[myId].slot;
 } else {
  let used=Object.values(players).map(p=>p.slot);
  let free=[0,1,2,3].find(s=>!used.includes(s));
  mySlot = free!==undefined? free : (Object.keys(players).length%4);
 }
 await mpSync();
}
async function mpSync(){
 if(!mpReady||!myId||!S) return;
 let players=(await wsGet('world_players'))||{};
 players[myId]={name:myId,slot:mySlot,res:S.res,buildings:S.buildings,troops:S.troops,stats:S.stats,updated:now()};
 await wsSet('world_players',players);

}
function pruneAttacks(attacks){
 let out={};
 for(let id in attacks){
  let a=attacks[id];
  if(!a.resolved || (now()-a.arriveEnd)<15*60*1000) out[id]=a;
 }
 return out;
}
function pruneReports(reports){
 let vals=Object.entries(reports).sort((a,b)=>b[1].time-a[1].time).slice(0,80);
 let out={}; vals.forEach(([id,r])=>out[id]=r); return out;
}
async function mpAttack(targetId){
 if(!mpReady){alert(t('mp_unavailable'));return;}
 let sp=parseInt(document.getElementById('mpsend_spear_'+targetId).value)||0;
 let sw=parseInt(document.getElementById('mpsend_sword_'+targetId).value)||0;
 if(sp>S.troops.spear||sw>S.troops.sword||(sp+sw)<=0){alert('!');return;}
 S.troops.spear-=sp;S.troops.sword-=sw; S.stats.attacksSent++; save();
 await mpSync();
 let attacks=(await wsGet('world_attacks'))||{};
 let id='a'+now()+'_'+Math.random().toString(36).slice(2,7);
 attacks[id]={id,from:myId,to:targetId,units:{spear:sp,sword:sw},sentAt:now(),arriveEnd:now()+45000,resolved:false};
 attacks=pruneAttacks(attacks);
 let ok=await wsSet('world_attacks',attacks);
 if(!ok){ alert('!'); S.troops.spear+=sp;S.troops.sword+=sw; S.stats.attacksSent--; save(); return; }
 mpAttacksCache=attacks;
 render();
}
async function mpResolveAttack(a){
 let players=(await wsGet('world_players'))||{};
 let def=players[a.to]||{troops:{spear:0,sword:0},res:{wood:0,clay:0,iron:0}};
 let atk=0; for(let u in a.units) atk+=a.units[u]*CFG.units[u].atk;
 let defp=0; for(let u in (def.troops||{})) defp+=(def.troops[u]||0)*(CFG.units[u]?CFG.units[u].def:10);
 let win=atk>defp;
 let lossRatio=win?Math.min(0.3,defp/(atk+1)):1;
 let lost={}; for(let u in a.units) lost[u]=Math.round(a.units[u]*lossRatio);
 let loot={wood:0,clay:0,iron:0};
 if(win){
  let survivors=0; for(let u in a.units) survivors+=(a.units[u]-lost[u]);
  let cap=survivors*25;
  ['wood','clay','iron'].forEach(r=>{let av=(def.res&&def.res[r])||0;let take=Math.min(av,cap/3);loot[r]=Math.round(take);});
 }
 if(a.to===myId && S){
  if(win) ['wood','clay','iron'].forEach(r=>{S.res[r]=Math.max(0,S.res[r]-loot[r]);});
  for(let u in a.units) S.troops[u]=Math.max(0,(S.troops[u]||0)-lost[u]);
  S.stats.attacksReceived++; S.stats.attacksReceivedWon += win?0:1; S.stats.attacksReceivedLost += win?1:0;
  save(); await mpSync();
 }
 if(a.from===myId && S){
  for(let u in a.units){ S.troops[u]=(S.troops[u]||0)+(a.units[u]-lost[u]); S.stats.troopsLost[u]=(S.stats.troopsLost[u]||0)+lost[u]; }
  if(win) ['wood','clay','iron'].forEach(r=>{S.res[r]=Math.min(storeCap(),S.res[r]+loot[r]);});
  S.stats.attacksSentWon += win?1:0; S.stats.attacksSentLost += win?0:1;
  save(); await mpSync();
 }
 let attacks=(await wsGet('world_attacks'))||{};
 if(attacks[a.id]){ attacks[a.id].resolved=true; attacks=pruneAttacks(attacks); await wsSet('world_attacks',attacks); }
 let reports=(await wsGet('world_reports'))||{};
 reports[a.id]={from:a.from,to:a.to,win,sent:a.units,lost,loot,time:now()};
 reports=pruneReports(reports);
 await wsSet('world_reports',reports);
}
async function mpPoll(){
 if(!mpReady||!myId) return;
 let players=(await wsGet('world_players'))||{};
 mpPlayers=players;
 let attacks=(await wsGet('world_attacks'))||{};
 mpAttacksCache=attacks;
 for(let id in attacks){
  let a=attacks[id];
  if(!a.resolved && now()>=a.arriveEnd && (a.from===myId||a.to===myId)){
   await mpResolveAttack(a);
  }
 }
 mpIncoming=Object.values(mpAttacksCache).filter(a=>a.to===myId && !a.resolved);
 let reports=(await wsGet('world_reports'))||{};
 mpReports=Object.values(reports).filter(r=>r.from===myId||r.to===myId).sort((a,b)=>b.time-a.time);
 await fetchWorldSettings();
 safeRender();
}
function startMpPolling(){
 if(mpPollTimer||!mpReady) return;
 mpPoll();
 mpPollTimer=setInterval(mpPoll,3500);
}
function stopMpPolling(){ if(mpPollTimer){clearInterval(mpPollTimer);mpPollTimer=null;} }

}

function updateAttackBanner(){
 let el=document.getElementById('attackBanner');
 if(!el) return;
 if(!S){ el.style.display='none'; return; }
 let incoming=(mpIncoming||[]).filter(a=>!a.resolved && a.arriveEnd>now());
 if(incoming.length===0){ el.style.display='none'; return; }
 incoming.sort((a,b)=>a.arriveEnd-b.arriveEnd);
 let a=incoming[0];
 let total=Math.max(1,a.arriveEnd-a.sentAt);
 let progress=Math.min(1,Math.max(0,(now()-a.sentAt)/total));
 let imminent=progress>=0.75;
 el.style.display='block';
 el.className='attack-banner'+(imminent?' imminent':'');
 let extra=incoming.length>1? ` (+${incoming.length-1} ${t('attack_banner_other_attacks')})` : '';
 el.innerHTML=(imminent? t('attack_banner_imminent')+' ' : t('attack_banner_incoming')+' ')+
  `<b>${a.from}</b> ${t('attack_banner_arrives_in')} <b>${countdown(a.arriveEnd)}</b>${extra}`;
}

 <div class="row"><small>${t('world_stats_troops_lost')}</small><b>${unitName('spear')} ${st.troopsLost.spear||0} · ${unitName('sword')} ${st.troopsLost.sword||0}</b></div>
 <div class="row"><small>${t('world_stats_attacks_sent')}</small><b>${st.attacksSent} (${st.attacksSentWon} ${t('world_stats_attacks_sent_won')}, ${st.attacksSentLost} ${t('world_stats_attacks_sent_lost')})</b></div>
 <div class="row"><small>${t('world_stats_attacks_received')}</small><b>${st.attacksReceived} (${st.attacksReceivedWon} ${t('world_stats_attacks_sent_won')}, ${st.attacksReceivedLost} ${t('world_stats_attacks_sent_lost')})</b></div>
 </div>
 <div class="card"><h2>${t('world_stats_buildings_title')}</h2>
 ${BUILD_KEYS.map(b=>`<div class="row"><small>${buildName(b)} (${t('building_level')} ${S.buildings[b]})</small>${buildingPreviewCurrent(b)}</div>`).join('')}
 </div>
 <div class="card"><h2>${t('world_stats_map_title')}</h2><small>${t('world_stats_map_desc')}</small>
 ${renderWorldAggregate()}
 </div>`;
}
function renderWorldAggregate(){
 let all = mpReady? Object.values(mpPlayers) : (S? [{res:S.res,stats:S.stats,troops:S.troops}] : []);
 let total = {res:{wood:0,clay:0,iron:0}, troopsTrained:{spear:0,sword:0}, troopsLost:{spear:0,sword:0}, attacksSent:0, attacksReceived:0, players: all.length};
 all.forEach(p=>{
  if(p.res) ['wood','clay','iron'].forEach(r=>total.res[r]+=p.res[r]||0);
  let s=p.stats||{};
  if(s.troopsTrained) ['spear','sword'].forEach(u=>total.troopsTrained[u]+=s.troopsTrained[u]||0);
  if(s.troopsLost) ['spear','sword'].forEach(u=>total.troopsLost[u]+=s.troopsLost[u]||0);
  total.attacksSent += s.attacksSent||0;
  total.attacksReceived += s.attacksReceived||0;
 });
 return `<div class="row"><small>${t('mp_players_in_room')}</small><b>${total.players}/4</b></div>
 <div class="row"><small>🪵🧱⛏️ ${t('world_stats_res_gained')}</small><b>🪵${fmt(total.res.wood)} 🧱${fmt(total.res.clay)} ⛏️${fmt(total.res.iron)}</b></div>
 <div class="row"><small>${t('world_stats_troops_trained')}</small><b>${unitName('spear')} ${total.troopsTrained.spear} · ${unitName('sword')} ${total.troopsTrained.sword}</b></div>
 <div class="row"><small>${t('world_stats_troops_lost')}</small><b>${unitName('spear')} ${total.troopsLost.spear} · ${unitName('sword')} ${total.troopsLost.sword}</b></div>
 <div class="row"><small>${t('world_stats_attacks_sent')}</small><b>${total.attacksSent}</b></div>`;
}

function renderAboutTab(){
 return `<h2>${t('settings_tab_about')}</h2>
 <div class="card" style="text-align:center;line-height:2">
 <div><b>Feito Por ADM Games</b></div>
 <div>Desenvolvedores: Alisson Macedo, Diego Macedo, Davi, Milhomem, Álvaro Falcão.</div>
 <div style="font-size:30px;margin-top:6px">🇧🇷</div>
 </div>`;
}

// ---- Login / Logout (perfis locais, cada um mantém sua própria aldeia) ----
function renderLoginScreen(){
 let el=document.getElementById('loginCard');
 if(!el) return;
 el.innerHTML=`<h1>${t('login_title')}</h1>
  <p>${t('login_desc')}</p>
  <input type="text" id="loginName" placeholder="${t('login_placeholder')}" maxlength="20">
  <button class="act" onclick="doLogin()">${t('login_btn')}</button>
  <div id="savedProfiles"></div>`;
 let ln=document.getElementById('loginName');
 if(ln) ln.addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });
 renderSavedProfiles();
}
function renderSavedProfiles(){
 let el=document.getElementById('savedProfiles');
 if(!el) return;
 let profiles=listProfiles();
 if(profiles.length===0){ el.innerHTML=''; return; }
 el.innerHTML=`<small>${t('login_saved_profiles')}</small><div class="profile-list">${profiles.map(p=>`<button onclick="quickLogin('${p.replace(/'/g,"\\'")}')">${p}</button>`).join('')}</div>`;
}
function doLogin(){
 let name=document.getElementById('loginName').value.trim();
 if(!name){alert('!');return;}
 startGame(name);
}
function quickLogin(name){ startGame(name); }
async function startGame(name){
 name=name.trim();
 if(!name) return;
 ACTIVE_PROFILE=name;
 myId=name;
 setActiveProfile(name);
 S=load(name);
 document.getElementById('loginScreen').style.display='none';
 document.getElementById('gameRoot').style.display='block';
 await fetchWorldSettings();
 tick();render();renderSettingsModal();
 if(mpReady){
  try{ await mpEnsureJoined(); startMpPolling(); render(); }catch(e){}
 }
}
function doLogoutSilent(){
 if(!S) return;
 save();
 clearActiveProfile();
 stopMpPolling();
 ACTIVE_PROFILE=null; S=null; myId=''; mySlot=0;
 mpPlayers={}; mpIncoming=[]; mpReports=[]; mpAttacksCache={};
 document.getElementById('gameRoot').style.display='none';
 document.getElementById('loginScreen').style.display='flex';
 renderLoginScreen();
 document.getElementById('loginName').value='';
 renderSettingsModal();
 updateAttackBanner();
}
function doLogout(){
 if(!S) return;
 if(!confirm(t('account_logout_confirm'))) return;
 doLogoutSilent();
}
function initLoginScreen(){
 renderLoginScreen();
 let active=getActiveProfile();
 if(active) startGame(active);
}
initLoginScreen();

</script>
